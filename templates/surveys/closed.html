<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survei Tidak Aktif - SiSurvei</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="min-h-full flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-slate-200/90 shadow-xl text-center space-y-6">
    <div class="w-20 h-20 rounded-full bg-amber-50 text-amber-500 flex items-center justify-center text-4xl mx-auto shadow-sm">
      <i class="fa-solid fa-lock"></i>
    </div>

    <div>
      <span class="text-xs font-mono font-bold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full border border-slate-200">{{ survei.kode_survei }}</span>
      <h2 class="text-2xl font-extrabold text-slate-900 mt-2">Pengumpulan Ditutup</h2>
      <p class="text-xs sm:text-sm text-slate-500 mt-2 leading-relaxed">
        Mohon maaf, survei <strong class="text-slate-800">"{{ survei.judul }}"</strong> saat ini berstatus <span class="font-bold text-amber-600">{{ survei.status }}</span> dan tidak menerima tanggapan baru.
      </p>
    </div>

    <div class="pt-4 border-t border-slate-100">
      <a href="{{ url_for('dashboard') }}" class="w-full py-3 text-xs font-bold text-white bg-slate-900 hover:bg-slate-800 rounded-xl transition inline-flex items-center justify-center gap-2">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Kembali ke Beranda</span>
      </a>
    </div>
  </div>

</body>
</html>
